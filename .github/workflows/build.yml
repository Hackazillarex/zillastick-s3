name: Build & Publish

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: platformio run

      # ── Copy binaries into docs/firmware/ for the web flasher ──
      - name: Stage firmware binaries
        run: |
          mkdir -p docs/firmware
          cp .pio/build/pingequa/firmware.bin   docs/firmware/firmware.bin
          cp .pio/build/pingequa/bootloader.bin docs/firmware/bootloader.bin
          cp .pio/build/pingequa/partitions.bin docs/firmware/partitions.bin
          # boot_app0.bin lives in the framework package
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          cp "$BOOT" docs/firmware/boot_app0.bin

      # ── Update version in manifest.json on tagged releases ──
      - name: Update manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python3 - <<EOF
          import json, pathlib
          m = json.loads(pathlib.Path('docs/manifest.json').read_text())
          m['version'] = '$TAG'
          pathlib.Path('docs/manifest.json').write_text(json.dumps(m, indent=2) + '\n')
          EOF

      # ── Commit updated docs/ back to main (skip on PRs) ──
      - name: Commit firmware to docs/
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/ docs/manifest.json
          git diff --cached --quiet || git commit -m "ci: update firmware binaries [skip ci]"
          git push origin HEAD:main

      # ── Create GitHub Release with bin attachments on tags ──
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/firmware/firmware.bin
            docs/firmware/bootloader.bin
            docs/firmware/partitions.bin
            docs/firmware/boot_app0.bin
          generate_release_notes: true
